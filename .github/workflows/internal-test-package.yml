name: Internal Test Package

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package-internal-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Strict production audit
        run: pnpm audit --prod
      - name: Release readiness
        run: pnpm release:verify
      - name: Build extension
        run: pnpm build:extension
      - name: Read internal release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e 'const release = require("./INTERNAL_RELEASE.json"); process.stdout.write(release.version)')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create source-of-truth internal package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package="efesto-v${RELEASE_VERSION}-windows.zip"
          git archive --format=zip --output="$package" HEAD
          unzip -l "$package" > package-contents.txt
          grep -q 'Install Efesto.cmd' package-contents.txt
          grep -q 'scripts/install-efesto.ps1' package-contents.txt
          grep -q 'scripts/qualify-packaged-windows-install.ps1' package-contents.txt
          grep -q 'pnpm-lock.yaml' package-contents.txt
          grep -q 'INTERNAL_RELEASE.json' package-contents.txt
          if grep -Eq '(^|/)(node_modules|\.git|\.hephaestus|\.hermes)/' package-contents.txt; then
            echo 'Forbidden runtime/development state found in internal package.' >&2
            exit 1
          fi
          sha256sum "$package" > SHA256SUMS.txt
          {
            echo "version=${RELEASE_VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > BUILD_INFO.txt
      - name: Upload internal candidate
        uses: actions/upload-artifact@v4
        with:
          name: efesto-v${{ steps.release.outputs.version }}-windows-${{ github.sha }}
          path: |
            efesto-v${{ steps.release.outputs.version }}-windows.zip
            SHA256SUMS.txt
            BUILD_INFO.txt
            package-contents.txt
            scripts/qualify-packaged-windows-install.ps1
          if-no-files-found: error
          retention-days: 14

  qualify-packaged-windows-install:
    name: qualify packaged install (${{ matrix.os }})
    needs: package-internal-windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - name: Download exact internal candidate
        uses: actions/download-artifact@v4
        with:
          name: efesto-v${{ needs.package-internal-windows.outputs.release-version }}-windows-${{ github.sha }}
          path: candidate
      - name: Verify, install and repair the exact packaged candidate
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File candidate/scripts/qualify-packaged-windows-install.ps1 `
            -CandidateDir candidate `
            -ReleaseVersion '${{ needs.package-internal-windows.outputs.release-version }}' `
            -ExpectedCommit '${{ github.sha }}'
