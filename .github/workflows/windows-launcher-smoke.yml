name: Windows Launcher Smoke

on:
  pull_request:
    paths:
      - 'apps/local-kernel/**'
      - 'scripts/efesto-*.mjs'
      - 'scripts/install-efesto.ps1'
      - 'Efesto Launcher.cmd'
      - 'Install Efesto.cmd'
      - '.github/workflows/windows-launcher-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Real Windows launcher bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $PWD '.uat-hephaestus'
          $vaultDir = Join-Path $PWD '.uat-vault'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $vaultDir | Out-Null
          Set-Content -Path (Join-Path $dataDir 'kernel-api-token') -Value ('a' * 64) -NoNewline

          $env:HEPHAESTUS_DATA_DIR = $dataDir
          $env:HEPHAESTUS_OBSIDIAN_DIR = $vaultDir
          $env:HEPHAESTUS_HERMES_EXECUTABLE = (Get-Command node).Source
          $env:HEPHAESTUS_PAIRING = '0'

          try {
            pnpm efesto:launcher repair
            if ($LASTEXITCODE -ne 0) { throw "launcher repair exited $LASTEXITCODE" }
            Start-Sleep -Seconds 2
            $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4000/status' -TimeoutSec 5
            if (-not $status.ok -or $status.service -ne 'hephaestus-local-kernel' -or $status.kernel -ne 'ready') {
              throw "Kernel status contract was not READY: $($status | ConvertTo-Json -Compress)"
            }
            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (-not (Test-Path $recordPath)) { throw 'Launcher PID record was not created' }
            $record = Get-Content $recordPath -Raw | ConvertFrom-Json
            $process = Get-Process -Id $record.pid -ErrorAction Stop
            if ($process.HasExited) { throw 'Launcher-owned Kernel process exited unexpectedly' }
            $bootstrap = node scripts/efesto-bootstrap.mjs | ConvertFrom-Json
            if ($bootstrap.kernel -ne 'ready') { throw "Bootstrap did not report Kernel ready" }
            if (-not $bootstrap.diagnostics.kernel.pidFilePresent -or -not $bootstrap.diagnostics.kernel.alive -or -not $bootstrap.diagnostics.kernel.owned) {
              throw "Launcher ownership diagnostics are incomplete"
            }
          }
          finally {
            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (Test-Path $recordPath) {
              try {
                $record = Get-Content $recordPath -Raw | ConvertFrom-Json
                if ($record.pid) { taskkill.exe /PID $record.pid /T /F 2>$null | Out-Null }
              } catch {}
            }
          }

  internal-port-conflict-repro:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Reproduce occupied 4001 startup failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $PWD '.uat-conflict-hephaestus'
          $vaultDir = Join-Path $PWD '.uat-conflict-vault'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $vaultDir | Out-Null
          Set-Content -Path (Join-Path $dataDir 'kernel-api-token') -Value ('b' * 64) -NoNewline

          $env:HEPHAESTUS_DATA_DIR = $dataDir
          $env:HEPHAESTUS_OBSIDIAN_DIR = $vaultDir
          $env:HEPHAESTUS_HERMES_EXECUTABLE = (Get-Command node).Source
          $env:HEPHAESTUS_PAIRING = '0'

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 4001)
          $listener.Start()
          try {
            pnpm efesto:launcher repair
            $exitCode = $LASTEXITCODE
            Start-Sleep -Seconds 1
            $bootstrap = node scripts/efesto-bootstrap.mjs | ConvertFrom-Json

            if ($exitCode -ne 1) { throw "Expected current launcher to fail with occupied 4001; got exit $exitCode" }
            if ($bootstrap.kernel -ne 'stale') { throw "Expected stale Kernel after occupied 4001; got $($bootstrap.kernel)" }
            if (-not $bootstrap.diagnostics.kernel.pidFilePresent -or $bootstrap.diagnostics.kernel.alive -or -not $bootstrap.diagnostics.kernel.owned) {
              throw "Did not reproduce owned-but-dead launcher state: $($bootstrap.diagnostics.kernel | ConvertTo-Json -Compress)"
            }
            Write-Host 'Reproduced UAT signature: owned launcher PID is dead after internal port 4001 conflict.'
          }
          finally {
            $listener.Stop()
            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (Test-Path $recordPath) {
              try {
                $record = Get-Content $recordPath -Raw | ConvertFrom-Json
                if ($record.pid) { taskkill.exe /PID $record.pid /T /F 2>$null | Out-Null }
              } catch {}
            }
          }
