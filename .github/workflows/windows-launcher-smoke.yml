name: Windows Launcher Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'apps/local-kernel/**'
      - 'scripts/efesto-*.mjs'
      - 'scripts/install-efesto.ps1'
      - 'Efesto Launcher.cmd'
      - 'Install Efesto.cmd'
      - 'INTERNAL_RELEASE.json'
      - '.github/workflows/windows-launcher-smoke.yml'
  pull_request:
    paths:
      - 'apps/local-kernel/**'
      - 'scripts/efesto-*.mjs'
      - 'scripts/install-efesto.ps1'
      - 'Efesto Launcher.cmd'
      - 'Install Efesto.cmd'
      - 'INTERNAL_RELEASE.json'
      - '.github/workflows/windows-launcher-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Real Windows launcher bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $PWD '.uat-hephaestus'
          $vaultDir = Join-Path $PWD '.uat-vault'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $vaultDir | Out-Null
          Set-Content -Path (Join-Path $dataDir 'kernel-api-token') -Value ('a' * 64) -NoNewline

          $env:HEPHAESTUS_DATA_DIR = $dataDir
          $env:HEPHAESTUS_OBSIDIAN_DIR = $vaultDir
          $env:HEPHAESTUS_HERMES_EXECUTABLE = (Get-Command node).Source
          $env:HEPHAESTUS_PAIRING = '0'

          try {
            pnpm efesto:launcher repair
            if ($LASTEXITCODE -ne 0) { throw "launcher repair exited $LASTEXITCODE" }
            Start-Sleep -Seconds 1

            $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4000/status' -TimeoutSec 5
            if (-not $status.ok -or $status.service -ne 'hephaestus-local-kernel' -or $status.kernel -ne 'ready') {
              throw "Kernel status contract was not READY: $($status | ConvertTo-Json -Compress)"
            }

            $bootstrap = node scripts/efesto-bootstrap.mjs | ConvertFrom-Json
            if ($bootstrap.kernel -ne 'ready') { throw 'Bootstrap did not report Kernel ready' }
            if (-not $bootstrap.diagnostics.kernel.pidFilePresent -or -not $bootstrap.diagnostics.kernel.alive -or -not $bootstrap.diagnostics.kernel.owned -or -not $bootstrap.diagnostics.kernel.verified) {
              throw "Launcher process was not fully verified: $($bootstrap.diagnostics.kernel | ConvertTo-Json -Compress)"
            }
          }
          finally {
            pnpm efesto:launcher shutdown 2>$null | Out-Null
            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (Test-Path $recordPath) {
              try {
                $record = Get-Content $recordPath -Raw | ConvertFrom-Json
                if ($record.pid) { taskkill.exe /PID $record.pid /T /F 2>$null | Out-Null }
              } catch {}
            }
          }

  internal-port-conflict-resilience:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Skip occupied 4001 and remain ready
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $PWD '.uat-conflict-hephaestus'
          $vaultDir = Join-Path $PWD '.uat-conflict-vault'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $vaultDir | Out-Null
          Set-Content -Path (Join-Path $dataDir 'kernel-api-token') -Value ('b' * 64) -NoNewline

          $env:HEPHAESTUS_DATA_DIR = $dataDir
          $env:HEPHAESTUS_OBSIDIAN_DIR = $vaultDir
          $env:HEPHAESTUS_HERMES_EXECUTABLE = (Get-Command node).Source
          $env:HEPHAESTUS_PAIRING = '0'

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 4001)
          $listener.Start()
          try {
            pnpm efesto:launcher repair
            if ($LASTEXITCODE -ne 0) { throw "launcher repair failed while 4001 was occupied: $LASTEXITCODE" }
            Start-Sleep -Seconds 1

            $outer = Invoke-RestMethod -Uri 'http://127.0.0.1:4000/status' -TimeoutSec 5
            if (-not $outer.ok -or $outer.kernel -ne 'ready') { throw 'External Kernel proxy was not ready' }

            $inner = Invoke-RestMethod -Uri 'http://127.0.0.1:4002/health' -TimeoutSec 5
            if (-not $inner.ok -or $inner.service -ne 'hephaestus-local-kernel') {
              throw "Expected internal Kernel on fallback port 4002: $($inner | ConvertTo-Json -Compress)"
            }

            $bootstrap = node scripts/efesto-bootstrap.mjs | ConvertFrom-Json
            if ($bootstrap.kernel -ne 'ready' -or -not $bootstrap.diagnostics.kernel.alive -or -not $bootstrap.diagnostics.kernel.verified) {
              throw "Efesto did not remain ready after skipping 4001: $($bootstrap.diagnostics.kernel | ConvertTo-Json -Compress)"
            }
          }
          finally {
            $listener.Stop()
            pnpm efesto:launcher shutdown 2>$null | Out-Null
            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (Test-Path $recordPath) {
              try {
                $record = Get-Content $recordPath -Raw | ConvertFrom-Json
                if ($record.pid) { taskkill.exe /PID $record.pid /T /F 2>$null | Out-Null }
              } catch {}
            }
          }

  pairing-restart-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Verify safe pairing restart on modern Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $PWD '.uat-restart-hephaestus'
          $vaultDir = Join-Path $PWD '.uat-restart-vault'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $vaultDir | Out-Null
          Set-Content -Path (Join-Path $dataDir 'kernel-api-token') -Value ('c' * 64) -NoNewline

          $env:HEPHAESTUS_DATA_DIR = $dataDir
          $env:HEPHAESTUS_OBSIDIAN_DIR = $vaultDir
          $env:HEPHAESTUS_HERMES_EXECUTABLE = (Get-Command node).Source
          # Keep pairing-session output disabled in CI; missing registry still makes pairing status required.
          $env:HEPHAESTUS_PAIRING = '0'

          try {
            pnpm efesto:launcher repair
            if ($LASTEXITCODE -ne 0) { throw "first launcher repair exited $LASTEXITCODE" }
            Start-Sleep -Milliseconds 750

            $before = node scripts/efesto-bootstrap.mjs | ConvertFrom-Json
            if ($before.kernel -ne 'ready' -or $before.pairing -ne 'required' -or -not $before.diagnostics.kernel.verified) {
              throw "Pre-restart state is not safely verified: $($before | ConvertTo-Json -Compress)"
            }
            $firstPid = [int]$before.diagnostics.kernel.pid

            pnpm efesto:launcher repair
            if ($LASTEXITCODE -ne 0) { throw "pairing recovery repair exited $LASTEXITCODE" }
            Start-Sleep -Milliseconds 750

            $after = node scripts/efesto-bootstrap.mjs | ConvertFrom-Json
            if ($after.kernel -ne 'ready' -or $after.pairing -ne 'required' -or -not $after.diagnostics.kernel.verified) {
              throw "Post-restart state is not safely verified: $($after | ConvertTo-Json -Compress)"
            }
            $secondPid = [int]$after.diagnostics.kernel.pid
            if ($firstPid -eq $secondPid) { throw 'Pairing recovery did not replace the launcher process' }

            $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4000/status' -TimeoutSec 5
            if (-not $status.ok -or $status.kernel -ne 'ready') { throw 'Kernel was not ready after pairing restart' }

            $internal = Invoke-RestMethod -Uri 'http://127.0.0.1:4001/health' -TimeoutSec 5
            if (-not $internal.ok) { throw 'Internal Kernel did not recover on 4001 after process-tree restart' }
          }
          finally {
            pnpm efesto:launcher shutdown 2>$null | Out-Null
            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (Test-Path $recordPath) {
              try {
                $record = Get-Content $recordPath -Raw | ConvertFrom-Json
                if ($record.pid) { taskkill.exe /PID $record.pid /T /F 2>$null | Out-Null }
              } catch {}
            }
          }
