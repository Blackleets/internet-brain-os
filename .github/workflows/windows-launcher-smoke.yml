name: Windows Launcher Smoke

on:
  pull_request:
    paths:
      - 'apps/local-kernel/**'
      - 'scripts/efesto-*.mjs'
      - 'scripts/install-efesto.ps1'
      - 'Efesto Launcher.cmd'
      - 'Install Efesto.cmd'
      - '.github/workflows/windows-launcher-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Real Windows launcher bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $PWD '.uat-hephaestus'
          $vaultDir = Join-Path $PWD '.uat-vault'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $vaultDir | Out-Null

          # Pre-seed a test-only token so this job isolates the base launcher runtime.
          Set-Content -Path (Join-Path $dataDir 'kernel-api-token') -Value ('a' * 64) -NoNewline

          $env:HEPHAESTUS_DATA_DIR = $dataDir
          $env:HEPHAESTUS_OBSIDIAN_DIR = $vaultDir
          $env:HEPHAESTUS_HERMES_EXECUTABLE = (Get-Command node).Source
          $env:HEPHAESTUS_PAIRING = '0'

          try {
            pnpm efesto:launcher repair
            if ($LASTEXITCODE -ne 0) { throw "launcher repair exited $LASTEXITCODE" }

            Start-Sleep -Seconds 2
            $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4000/status' -TimeoutSec 5
            if (-not $status.ok -or $status.service -ne 'hephaestus-local-kernel' -or $status.kernel -ne 'ready') {
              throw "Kernel status contract was not READY: $($status | ConvertTo-Json -Compress)"
            }

            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (-not (Test-Path $recordPath)) { throw 'Launcher PID record was not created' }
            $record = Get-Content $recordPath -Raw | ConvertFrom-Json
            $process = Get-Process -Id $record.pid -ErrorAction Stop
            if ($process.HasExited) { throw 'Launcher-owned Kernel process exited unexpectedly' }

            $bootstrap = node scripts/efesto-bootstrap.mjs | ConvertFrom-Json
            if ($bootstrap.kernel -ne 'ready') {
              throw "Bootstrap did not report Kernel ready: $($bootstrap | ConvertTo-Json -Compress)"
            }
            if (-not $bootstrap.diagnostics.kernel.pidFilePresent -or -not $bootstrap.diagnostics.kernel.alive -or -not $bootstrap.diagnostics.kernel.owned) {
              throw "Launcher ownership diagnostics are incomplete: $($bootstrap.diagnostics.kernel | ConvertTo-Json -Compress)"
            }
          }
          finally {
            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (Test-Path $recordPath) {
              try {
                $record = Get-Content $recordPath -Raw | ConvertFrom-Json
                if ($record.pid) { taskkill.exe /PID $record.pid /T /F 2>$null | Out-Null }
              } catch {}
            }
          }

  first-run-pairing-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Reproduce clean first-run pairing on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $PWD '.uat-pairing-hephaestus'
          $vaultDir = Join-Path $PWD '.uat-pairing-vault'
          $outputFile = Join-Path $PWD '.uat-pairing-output.txt'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $vaultDir | Out-Null

          $env:HEPHAESTUS_DATA_DIR = $dataDir
          $env:HEPHAESTUS_OBSIDIAN_DIR = $vaultDir
          $env:HEPHAESTUS_HERMES_EXECUTABLE = (Get-Command node).Source
          Remove-Item Env:HEPHAESTUS_PAIRING -ErrorAction SilentlyContinue

          try {
            # Capture output so the temporary one-use pairing code never enters public CI logs.
            pnpm efesto:launcher repair *> $outputFile
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              $safe = (Get-Content $outputFile -Raw) -replace 'Extension pairing code: [A-Z2-9]{8}', 'Extension pairing code: [REDACTED]'
              Write-Host $safe
              throw "clean first-run launcher repair exited $exitCode"
            }

            Start-Sleep -Seconds 2
            $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4000/status' -TimeoutSec 5
            if (-not $status.ok -or $status.service -ne 'hephaestus-local-kernel' -or $status.kernel -ne 'ready') {
              throw "Fresh pairing Kernel was not READY: $($status | ConvertTo-Json -Compress)"
            }

            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (-not (Test-Path $recordPath)) { throw 'Fresh pairing run did not create launcher PID record' }
            $record = Get-Content $recordPath -Raw | ConvertFrom-Json
            $process = Get-Process -Id $record.pid -ErrorAction Stop
            if ($process.HasExited) { throw 'Fresh pairing launcher-owned Kernel exited unexpectedly' }

            $bootstrap = node scripts/efesto-bootstrap.mjs | ConvertFrom-Json
            if ($bootstrap.kernel -ne 'ready' -or $bootstrap.pairing -ne 'required') {
              throw "Fresh first-run contract was unexpected: $($bootstrap | ConvertTo-Json -Compress)"
            }
            if (-not $bootstrap.diagnostics.kernel.pidFilePresent -or -not $bootstrap.diagnostics.kernel.alive -or -not $bootstrap.diagnostics.kernel.owned) {
              throw "Fresh first-run process diagnostics are incomplete: $($bootstrap.diagnostics.kernel | ConvertTo-Json -Compress)"
            }
          }
          catch {
            if (Test-Path $outputFile) {
              $safe = (Get-Content $outputFile -Raw) -replace 'Extension pairing code: [A-Z2-9]{8}', 'Extension pairing code: [REDACTED]'
              Write-Host $safe
            }
            throw
          }
          finally {
            $recordPath = Join-Path $dataDir 'efesto-launcher-process.json'
            if (Test-Path $recordPath) {
              try {
                $record = Get-Content $recordPath -Raw | ConvertFrom-Json
                if ($record.pid) { taskkill.exe /PID $record.pid /T /F 2>$null | Out-Null }
              } catch {}
            }
            Remove-Item $outputFile -Force -ErrorAction SilentlyContinue
          }
