name: Windows First Run Repro

on:
  pull_request:
    paths:
      - 'apps/local-kernel/**'
      - 'scripts/efesto-*.mjs'
      - 'scripts/install-efesto.ps1'
      - '.github/workflows/windows-first-run-repro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-first-install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Reproduce fresh Windows install with pairing and no Obsidian
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $PWD '.uat-real-first-run'
          $launcherLog = Join-Path $PWD '.uat-real-first-run-launcher.log'
          Remove-Item -Recurse -Force $dataDir -ErrorAction SilentlyContinue
          Remove-Item -Force $launcherLog -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          # Match the user's real environment: Hermes exists in the standard Windows install location.
          $hermesDir = Join-Path $env:LOCALAPPDATA 'hermes\hermes-agent\venv\Scripts'
          New-Item -ItemType Directory -Force -Path $hermesDir | Out-Null
          Copy-Item -Force (Get-Command node).Source (Join-Path $hermesDir 'hermes.exe')

          $env:HEPHAESTUS_DATA_DIR = $dataDir
          Remove-Item Env:HEPHAESTUS_OBSIDIAN_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:HEPHAESTUS_HERMES_EXECUTABLE -ErrorAction SilentlyContinue
          Remove-Item Env:HEPHAESTUS_PAIRING -ErrorAction SilentlyContinue
          Remove-Item Env:HEPHAESTUS_INTERNAL_PORT -ErrorAction SilentlyContinue
          Remove-Item Env:HEPHAESTUS_PORT -ErrorAction SilentlyContinue
          Remove-Item Env:IBOS_HERMES_SECRET -ErrorAction SilentlyContinue
          Remove-Item Env:HEPHAESTUS_HERMES_SECRET -ErrorAction SilentlyContinue

          try {
            # Capture inherited child output so the one-time pairing code never reaches Actions logs.
            & pnpm efesto:launcher repair *> $launcherLog
            $repairExit = $LASTEXITCODE
            Start-Sleep -Seconds 1

            $bootstrap = node scripts/efesto-bootstrap.mjs | ConvertFrom-Json
            if ($repairExit -ne 0 -or $bootstrap.kernel -ne 'ready' -or -not $bootstrap.diagnostics.kernel.alive -or -not $bootstrap.diagnostics.kernel.owned -or -not $bootstrap.diagnostics.kernel.verified) {
              Write-Host 'Sanitized launcher tail:'
              Get-Content $launcherLog -ErrorAction SilentlyContinue |
                Where-Object { $_ -notmatch '(?i)pairing code|token|secret|authorization|cookie' } |
                Select-Object -Last 100
              throw "Real first-run failed: exit=$repairExit bootstrap=$($bootstrap | ConvertTo-Json -Compress)"
            }

            if ($bootstrap.hermes -ne 'ready') { throw 'Standard Windows Hermes install was not detected.' }
            if ($bootstrap.obsidian -ne 'not_configured') { throw "Expected Obsidian not_configured, got $($bootstrap.obsidian)" }
            if ($bootstrap.pairing -ne 'required') { throw "Expected first-run pairing required, got $($bootstrap.pairing)" }
            if (-not (Test-Path (Join-Path $dataDir 'kernel-api-token'))) { throw 'First run did not create the private Kernel token.' }

            $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4000/status' -TimeoutSec 5
            if (-not $status.ok -or $status.kernel -ne 'ready') { throw 'Kernel did not stay ready after first-run pairing startup.' }
          }
          finally {
            pnpm efesto:launcher shutdown 2>$null | Out-Null
            Remove-Item -Force $launcherLog -ErrorAction SilentlyContinue
          }
